name: Sync WhenToWork Schedule

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Sync schedule
        env:
          W2W_USERNAME: ${{ secrets.W2W_USERNAME }}
          W2W_PASSWORD: ${{ secrets.W2W_PASSWORD }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node sync-w2w-schedule.js
